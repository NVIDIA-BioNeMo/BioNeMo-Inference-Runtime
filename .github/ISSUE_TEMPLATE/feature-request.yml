name: "Feature Request"
description: Propose a new feature or enhancement for BioIR
title: "[Feature]: "
labels: ["enhancement", "needs-discussion"]

body:
  - type: markdown
    attributes:
      value: >
        New features and API-breaking changes start here. A maintainer reviews
        and approves the request **before** a pull request is opened — see
        [contributing.md](https://github.com/NVIDIA-BioNeMo/BioNeMo-Inference-Runtime/blob/main/docs/contributing.md).

  - type: textarea
    id: motivation
    attributes:
      label: Problem & motivation
      description: What problem does this solve? Why is it needed?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Model / structure prediction
        - Inference / runtime
        - Data processing
        - Kernels / performance
        - API / interface
        - Packaging / build
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description:
        Describe the change you would like. Sketch the API if relevant.
      render: python
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated and why they fall short.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, references, or benchmarks that support the request.
    validations:
      required: false
