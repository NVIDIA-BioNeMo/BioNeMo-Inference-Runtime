# Dev container service. Builds the `dev` target from docker/Dockerfile -- the
# same image `make -C docker dev` produces -- and bind-mounts the checkout, so
# there is exactly one image definition in the repo. See docker/README.md.
services:
  bionemo-ir-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
      args:
        # Match the host user so build artifacts on the bind mount are not
        # root-owned. Set USER_UID/USER_GID in .devcontainer/.env to override
        # (VS Code reads that file automatically).
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}

    # Kernel compilation and the xdist test workers both need far more than the
    # 64 MB default; PyTorch fails obscurely without this. The ulimits match
    # what the CI test job passes, so a local run matches CI.
    shm_size: "10gb"
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host

    cap_add:
      - SYS_PTRACE

    # Delete this line if you have no GPU -- everything except the fused
    # kernels still runs on the PyTorch fallbacks.
    gpus: all

    volumes:
      - ..:/bioir:cached
      # ccache, pip and the compiled-kernel cache, kept across rebuilds.
      - bioir-cache:/cache

    command: sleep infinity

volumes:
  bioir-cache:
