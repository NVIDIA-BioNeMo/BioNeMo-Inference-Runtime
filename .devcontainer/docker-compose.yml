version: "3.9"
services:
  bionemo_ir-dev:
    image: <internal-registry-image>:pytorch-25.01-py3-x86_64-ubuntu24.04-trt10.8.0.43-skip-devel-202502131150-8377

    network_mode: host
    ipc: host

    # For GPU usage and profiling
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined

    # Delete this section if you don't have a GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - ..:/workspaces/bionemo_ir:cached

    environment:
      - CCACHE_DIR=/workspaces/bionemo_ir/cpp/.ccache
      - CCACHE_BASEDIR=/workspaces/bionemo_ir

    # Overrides default command so things don't shut down after the process ends.
    command: /bin/sh -c "while sleep 1000; do :; done"
